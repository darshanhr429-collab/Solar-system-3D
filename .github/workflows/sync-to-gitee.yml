name: Sync to Gitee

# Mirror GitHub to Gitee without overwriting Gitee-unique work.
# Pre-sync check: verify if Gitee has branches/tags or commits not present in GitHub.
# If detected, fail the workflow with a notice and do not push.
on:
  push:
  workflow_dispatch:

# Run serially within the same group to avoid SSH reset issues.
concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_SSH_COMMAND: >-
        ssh -i ~/.ssh/gitee_key
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o ConnectTimeout=20
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITEE_SSH_PRIVATE_KEY }}" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -T 10 gitee.com >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan gitee.com failed, skipped (does not depend on known_hosts)"

      - name: Guard against overwriting Gitee-only work
        run: |
          git remote add gitee "git@gitee.com:heyqzz/${{ github.event.repository.name }}.git" || true

          ok=0
          for i in 1 2 3 4 5; do
            if git fetch --no-tags gitee \
                 "+refs/heads/*:refs/remotes/gitee/*" \
                 "+refs/tags/*:refs/remotes/gitee-tags/*"; then
              ok=1; break
            fi
            echo "::warning::Failed to fetch Gitee state (attempt $i/5), retrying..."
            sleep $((i * 10))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to read Gitee state after 5 attempts. Sync aborted."
            exit 1
          fi

          RISK=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/gitee/); do
            b="${ref#gitee/}"
            [ "$b" = "HEAD" ] && continue
            gsha=$(git rev-parse "$ref")
            if ! git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              echo "::error::Gitee has a branch missing in GitHub: $b. Sync aborted."
              RISK=1
            elif ! git merge-base --is-ancestor "$gsha" "refs/remotes/origin/$b"; then
              echo "::error::Gitee branch $b has commits ($gsha) not present in GitHub. Sync aborted."
              RISK=1
            fi
          done
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/gitee-tags/); do
            t="${ref#gitee-tags/}"
            gsha=$(git rev-parse "$ref")
            if ! git show-ref --verify --quiet "refs/tags/$t"; then
              echo "::error::Gitee has a tag missing in GitHub: $t. Sync aborted."
              RISK=1
            elif [ "$gsha" != "$(git rev-parse "refs/tags/$t")" ]; then
              echo "::error::Tag $t points to different commits on Gitee and GitHub. Sync aborted."
              RISK=1
            fi
          done
          if [ "$RISK" -ne 0 ]; then
            echo "::error::Detected Gitee-unique content. Nothing pushed. Please verify first."
            exit 1
          fi

      - name: Push all branches and tags
        run: |
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/); do
            branch="${ref#origin/}"
            [ "$branch" = "HEAD" ] && continue
            git show-ref --verify --quiet "refs/heads/$branch" || git branch "$branch" "$ref"
          done

          ok=0
          for i in 1 2 3 4 5; do
            if git push --force --prune gitee --all; then ok=1; break; fi
            echo "::warning::Push branches failed (attempt $i/5), retrying..."
            sleep $((i * 10))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to push branches after 5 attempts."
            exit 1
          fi

          for i in 1 2 3; do
            if git push --force --prune gitee "refs/tags/*:refs/tags/*"; then
              exit 0
            fi
            echo "::warning::Push tags failed (attempt $i/3), retrying..."
            sleep $((i * 10))
          done
          echo "::warning::Failed to sync tags; branches were synced successfully."
